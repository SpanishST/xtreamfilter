<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download History - XtreamFilter</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .top-nav { display: flex; align-items: center; gap: 20px; margin-bottom: 25px; padding: 12px 20px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; flex-wrap: wrap; }
        .top-nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #00d4ff; font-weight: 700; font-size: 1.15em; white-space: nowrap; }
        .top-nav-brand:hover { color: #33ddff; }
        .top-nav-links { display: flex; gap: 4px; flex-wrap: wrap; margin-left: auto; }
        .top-nav-link { padding: 8px 16px; border-radius: 8px; background: transparent; border: 1px solid transparent; color: #888; text-decoration: none; font-size: 0.9em; transition: all 0.2s; display: inline-flex; align-items: center; gap: 6px; position: relative; white-space: nowrap; }
        .top-nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .top-nav-link.active { color: #00d4ff; background: rgba(0, 212, 255, 0.12); border-color: rgba(0, 212, 255, 0.25); }
        .nav-cart-badge { position: absolute; top: 2px; right: 2px; background: #ff4757; color: #fff; font-size: 0.65em; font-weight: 700; min-width: 16px; height: 16px; border-radius: 8px; display: flex; align-items: center; justify-content: center; padding: 0 4px; }
        .nav-version { font-size: 0.7em; padding: 3px 10px; border-radius: 12px; background: rgba(255, 255, 255, 0.08); color: #888; cursor: default; white-space: nowrap; }
        .page-header { display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
        .page-header h1 { color: #00d4ff; font-size: 1.6em; margin-bottom: 6px; }
        .page-header p { color: #888; font-size: 0.9em; }
        .btn { display: inline-block; padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.95em; cursor: pointer; transition: all 0.3s; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, #00d4ff, #0099cc); color: #000; font-weight: 600; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(0, 212, 255, 0.4); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        .toolbar { display: flex; gap: 10px; align-items: center; padding: 15px; margin-bottom: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px; flex-wrap: wrap; }
        .toolbar input, .toolbar select { padding: 10px 12px; border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 0.9em; color-scheme: dark; }
        .toolbar input { flex: 1 1 280px; min-width: 180px; }
        .toolbar select { min-width: 150px; }
        .toolbar option { background: #1a1a2e; color: #fff; }
        .history-summary { color: #888; font-size: 0.9em; margin: 0 5px 12px; }
        .history-summary strong { color: #00d4ff; }
        .history-list { display: flex; flex-direction: column; gap: 8px; }
        .history-entry { display: grid; grid-template-columns: 54px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 12px 15px; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.07); border-radius: 10px; transition: background 0.15s, border-color 0.15s; }
        .history-entry:hover { background: rgba(255, 255, 255, 0.07); border-color: rgba(0, 212, 255, 0.25); }
        .history-thumb, .history-thumb-placeholder { width: 54px; height: 76px; border-radius: 5px; object-fit: cover; background: linear-gradient(135deg, rgba(0, 212, 255, 0.12), rgba(0, 0, 0, 0.3)); }
        .history-thumb-placeholder { display: flex; align-items: center; justify-content: center; font-size: 1.5em; }
        .history-title { color: #fff; font-weight: 600; line-height: 1.35; word-break: break-word; }
        .history-subtitle { color: #aaa; font-size: 0.85em; margin-top: 4px; word-break: break-word; }
        .history-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
        .history-chip { display: inline-block; padding: 3px 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.08); color: #999; font-size: 0.75em; }
        .history-chip.type-vod { background: rgba(116, 185, 255, 0.18); color: #74b9ff; }
        .history-chip.type-series { background: rgba(162, 155, 254, 0.18); color: #a29bfe; }
        .history-date { color: #aaa; font-size: 0.85em; text-align: right; white-space: nowrap; }
        .history-path { color: #666; font-size: 0.75em; margin-top: 5px; max-width: 420px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .empty-state { text-align: center; padding: 70px 20px; color: #666; background: rgba(255, 255, 255, 0.03); border-radius: 12px; border: 1px solid rgba(255, 255, 255, 0.07); }
        .empty-state-icon { font-size: 4em; margin-bottom: 20px; opacity: 0.3; }
        .empty-state h3 { color: #888; margin-bottom: 10px; }
        .load-more { width: 100%; margin-top: 15px; display: none; }
        .load-more.visible { display: block; }
        @media (max-width: 768px) {
            .top-nav { gap: 10px; padding: 10px 14px; }
            .top-nav-links { margin-left: 0; width: 100%; }
            .top-nav-link { flex: 1; justify-content: center; padding: 8px 7px; font-size: 0.78em; }
            .history-entry { grid-template-columns: 45px minmax(0, 1fr); gap: 10px; }
            .history-thumb, .history-thumb-placeholder { width: 45px; height: 64px; }
            .history-date { grid-column: 2; text-align: left; }
            .history-path { max-width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <nav class="top-nav">
            <a href="/" class="top-nav-brand">📺 XtreamFilter</a>
            <span id="version-badge" class="nav-version" style="display:none"></span>
            <div class="top-nav-links">
                <a href="/" class="top-nav-link">⚙️ Settings</a>
                <a href="/browse" class="top-nav-link">🔍 Browse</a>
                <a href="/cart" class="top-nav-link">🛒 Cart<span class="nav-cart-badge" id="cart-badge" style="display:none">0</span></a>
                <a href="/monitor" class="top-nav-link">📡 Monitor</a>
                <a href="/history" class="top-nav-link active">📥 History</a>
                <a href="/logs" class="top-nav-link">📝 Logs</a>
            </div>
        </nav>

        <div class="page-header">
            <div>
                <h1>Download History</h1>
                <p>Completed movie files and series episodes.</p>
            </div>
            <a href="/browse" class="btn btn-primary">🔍 Browse Catalog</a>
        </div>

        <div class="toolbar">
            <input type="search" id="history-search" placeholder="Search downloaded titles..." onkeydown="if(event.key === 'Enter') loadHistory()">
            <select id="history-type" onchange="loadHistory()">
                <option value="">All Types</option>
                <option value="vod">Films</option>
                <option value="series">Series</option>
            </select>
            <select id="history-source" onchange="loadHistory()">
                <option value="">All Sources</option>
            </select>
            <button class="btn btn-secondary" onclick="loadHistory()">↻ Refresh</button>
        </div>

        <div class="history-summary">Showing <strong id="history-count">0</strong> of <strong id="history-total">0</strong> downloads</div>
        <div class="history-list" id="history-list"></div>
        <div class="empty-state" id="history-empty" style="display:none;">
            <div class="empty-state-icon">📥</div>
            <h3>No downloads found</h3>
            <p>Completed downloads will appear here.</p>
        </div>
        <button class="btn btn-secondary load-more" id="history-load-more" onclick="loadMoreHistory()">Load more</button>
    </div>

    <footer style="text-align:center; padding: 20px; margin-top: 40px; color: #555; font-size: 0.85em; border-top: 1px solid rgba(255,255,255,0.07);">
        <a href="https://github.com/SpanishST/xtreamfilter" target="_blank" rel="noopener noreferrer" style="color: #00d4ff; text-decoration: none; opacity: 0.5;">★ XtreamFilter on GitHub</a>
    </footer>

    <script>
        const HISTORY_PAGE_SIZE = 50;
        let historyOffset = 0;
        let historyLoading = false;

        function escapeHtml(value) {
            const div = document.createElement('div');
            div.textContent = value == null ? '' : String(value);
            return div.innerHTML;
        }

        function formatBytes(bytes) {
            if (!bytes) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
            return parseFloat((bytes / Math.pow(1024, index)).toFixed(1)) + ' ' + units[index];
        }

        function formatDate(value) {
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? (value || '') : date.toLocaleString();
        }

        async function loadSources() {
            try {
                const response = await fetch('/api/sources');
                const data = await response.json();
                const select = document.getElementById('history-source');
                (data.sources || []).forEach(source => {
                    const option = document.createElement('option');
                    option.value = source.id;
                    option.textContent = source.name || source.id;
                    select.appendChild(option);
                });
            } catch (error) { console.error('Error loading sources:', error); }
        }

        function createHistoryEntry(item) {
            const isSeries = item.content_type === 'series';
            const title = isSeries ? (item.series_name || item.name || 'Unknown series') : (item.name || 'Unknown movie');
            let subtitle = '';
            if (isSeries) {
                subtitle = 'S' + String(item.season || 1).padStart(2, '0') + 'E' + String(item.episode_num || 0).padStart(2, '0');
                if (item.episode_title || item.name) subtitle += ' · ' + (item.episode_title || item.name);
            }
            const thumbnail = item.icon
                ? '<img class="history-thumb" src="' + escapeHtml(item.icon) + '" loading="lazy" alt="" onerror="this.style.display=\'none\';this.nextSibling.style.display=\'flex\'">' +
                  '<div class="history-thumb-placeholder" style="display:none">🎬</div>'
                : '<div class="history-thumb-placeholder">🎬</div>';
            const group = item.grp ? '<span class="history-chip">' + escapeHtml(item.grp) + '</span>' : '';
            return '<article class="history-entry">' +
                thumbnail +
                '<div>' +
                '<div class="history-title">' + escapeHtml(title) + '</div>' +
                (subtitle ? '<div class="history-subtitle">' + escapeHtml(subtitle) + '</div>' : '') +
                '<div class="history-meta">' +
                '<span class="history-chip type-' + (isSeries ? 'series' : 'vod') + '">' + (isSeries ? 'Series episode' : 'Film') + '</span>' +
                '<span class="history-chip">' + escapeHtml(item.source_name || item.source_id || 'Unknown source') + '</span>' +
                '<span class="history-chip">' + formatBytes(item.file_size) + '</span>' +
                group +
                '</div>' +
                '<div class="history-path" title="' + escapeHtml(item.file_path || '') + '">' + escapeHtml(item.file_path || '') + '</div>' +
                '</div>' +
                '<div class="history-date">' + escapeHtml(formatDate(item.completed_at)) + '</div>' +
                '</article>';
        }

        async function loadHistory(reset = true) {
            if (historyLoading) return;
            historyLoading = true;
            if (reset) {
                historyOffset = 0;
                document.getElementById('history-list').innerHTML = '';
            }
            const params = new URLSearchParams({
                limit: String(HISTORY_PAGE_SIZE),
                offset: String(historyOffset),
                type: document.getElementById('history-type').value,
                source: document.getElementById('history-source').value,
                search: document.getElementById('history-search').value.trim()
            });
            try {
                const response = await fetch('/api/download-history?' + params.toString());
                if (!response.ok) throw new Error('History request failed');
                const data = await response.json();
                document.getElementById('history-list').insertAdjacentHTML('beforeend', (data.items || []).map(createHistoryEntry).join(''));
                historyOffset += (data.items || []).length;
                document.getElementById('history-count').textContent = historyOffset;
                document.getElementById('history-total').textContent = data.total || 0;
                document.getElementById('history-empty').style.display = data.total === 0 ? 'block' : 'none';
                document.getElementById('history-load-more').classList.toggle('visible', !!data.has_more);
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('history-empty').style.display = 'block';
            } finally {
                historyLoading = false;
            }
        }

        function loadMoreHistory() { loadHistory(false); }

        async function updateCartBadge() {
            try {
                const response = await fetch('/api/cart/status');
                const data = await response.json();
                const badge = document.getElementById('cart-badge');
                const count = (data.queued || 0) + (data.downloading || 0);
                badge.textContent = count;
                badge.style.display = count ? 'flex' : 'none';
            } catch (error) { /* optional navigation badge */ }
        }

        loadSources();
        loadHistory();
        updateCartBadge();
    </script>
</body>
</html>
